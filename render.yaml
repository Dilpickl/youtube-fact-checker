# Hosts the fact-check server on Render's free tier (see README, "Host the
# server"). The API key is typed into Render's dashboard, never committed.
services:
  - type: web
    name: video-fact-check
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/main.ts
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Where the day's spend is kept, so the budget survives restarts.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: video-fact-check-budget
          property: connectionString
      - key: NODE_VERSION
        value: 24.16.0
  - type: keyvalue
    name: video-fact-check-budget
    plan: free
    # No addresses outside Render may connect; the server reaches it privately.
    ipAllowList: []
